[project]
name = "control-plane"
version = "0.1.0"
description = "Enterprise AI Control Plane: application registry and governed release of a managed triage app."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "google-cloud-firestore>=2.16",
    "google-cloud-bigquery>=3.25",
    "google-cloud-storage>=2.17",
    "google-genai>=1.0",
    "scikit-learn>=1.5",
    "numpy>=1.26",
    "pandas>=2.2",
    "typer>=0.12",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-pyyaml>=6.0",
    "pandas-stubs>=2.2",
]

[project.scripts]
cp = "control_plane.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/control_plane"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
# Hand-written seed data (long prose lines) and a seeded, non-cryptographic generator.
"scripts/gen_registry_seed.py" = ["E501", "S311", "B023"]
# SQL text interpolates only fixed identifiers (project, dataset, table names from config);
# every value is a named query parameter. Long lines are SQL.
"backend/control_plane/analytics/*.py" = ["S608", "E501"]
# Diagram sources are coordinates and label text; draw.io style strings are copied verbatim.
# The build calls the draw.io CLI with fixed arguments; the validator parses our own files.
"docs/diagrams/**/*.py" = ["E501", "S603"]
".claude/skills/gcp-architecture-diagram/scripts/*.py" = ["E501", "S310", "S314"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "backend"
packages = ["control_plane"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["google.cloud.*", "sklearn.*"]
ignore_missing_imports = true

# google-auth ships without complete type hints.
[[tool.mypy.overrides]]
module = ["control_plane.iap"]
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]
markers = ["emulator: requires FIRESTORE_EMULATOR_HOST"]
